# ===================================================
# Hospital Booking System – application.properties
# FIXED: MySQL connection + proper error pages + security
# ===================================================

spring.application.name=hospital-booking-system
server.port=8080

# ── MySQL Database ───────────────────────────────────────────────────────────
# Set DB_USERNAME and DB_PASSWORD as environment variables, or edit defaults below
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_booking?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=root
spring.datasource.password=Tamil123%
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.open-in-view=false

# ── Connection Pool (HikariCP) ───────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:aG9zcGl0YWwtYm9va2luZy1zeXN0ZW0tc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctbXVzdC1iZS1hdC1sZWFzdC0zMi1jaGFyYWN0ZXJzLWxvbmc=}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ── Cashfree Payment Gateway (optional) ─────────────────────────────────────
cashfree.app-id=${CASHFREE_APP_ID:}
cashfree.secret-key=${CASHFREE_SECRET_KEY:}
cashfree.base-url=https://sandbox.cashfree.com/pg

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.hospital.booking=INFO
logging.level.com.zaxxer.hikari=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ── Thymeleaf ────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ── Error Handling (custom ErrorController handles /error) ───────────────────
server.error.whitelabel.enabled=false
server.error.path=/error
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# ── Multipart ────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Session ──────────────────────────────────────────────────────────────────
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# ── MVC: throw NoHandlerFoundException for unknown routes ────────────────────
spring.web.resources.add-mappings=true
spring.mvc.throw-exception-if-no-handler-found=false
