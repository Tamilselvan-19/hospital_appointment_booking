<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Schedule – Doctor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--pr:#0a4d8c;--ac:#00b4d8;--dk:#071d34;--lt:#f0f7ff}
    body{font-family:'DM Sans',sans-serif;background:#f3f6fb}
    .sidebar{min-height:100vh;background:var(--dk)}
    .sidebar .nav-link{color:rgba(255,255,255,.75);padding:12px 20px;transition:.2s}
    .sidebar .nav-link:hover,.sidebar .nav-link.active{color:#fff;background:rgba(255,255,255,.1);border-left:3px solid var(--ac)}
    .top-bar{background:#fff;padding:14px 28px;box-shadow:0 1px 12px rgba(10,77,140,.06);display:flex;align-items:center;justify-content:space-between}
    .main{padding:28px;flex:1;overflow-y:auto}
    .card-s{border:none;border-radius:16px;background:#fff;box-shadow:0 2px 16px rgba(10,77,140,.07);padding:22px}
    .stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
    .table thead{background:var(--pr);color:#fff}
    .table thead th{border:none;padding:13px 16px;font-weight:500}
    .table tbody td{padding:12px 16px;vertical-align:middle}
    .table tbody tr:hover{background:#f8fbff}
    .badge-pending{background:#fff3cd;color:#856404}
    .badge-confirmed{background:#d1ecf1;color:#0c5460}
    .badge-completed{background:#d4edda;color:#155724}
    .badge-cancelled{background:#f8d7da;color:#721c24}
    .badge-no_show{background:#e2e3e5;color:#383d41}
    .form-control,.form-select{border-radius:10px;border:1.5px solid #e2e8f0}
    .form-control:focus,.form-select:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(10,77,140,.1)}
    .btn-primary{background:var(--pr);border:none;border-radius:10px}
    .btn-primary:hover{background:#0d5ea6}
    .alert-box{position:fixed;top:80px;right:24px;z-index:9999;min-width:300px}
    .time-slot{border:2px solid #e2e8f0;border-radius:10px;padding:10px;text-align:center;cursor:pointer;transition:.25s;font-weight:500}
    .time-slot:hover{border-color:var(--pr);background:var(--lt)}
    .time-slot.selected{border-color:var(--pr);background:var(--pr);color:#fff}
    .time-slot.unavailable{background:#fee2e2;border-color:#fca5a5;color:#991b1b;cursor:not-allowed}
    .doctor-card{border:none;border-radius:16px;box-shadow:0 2px 16px rgba(10,77,140,.07);transition:all .3s}
    .doctor-card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(10,77,140,.14)}
    .doc-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--pr),var(--ac));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6rem}
    .step-wrap{display:flex;align-items:center;margin-bottom:32px}
    .step-dot{width:36px;height:36px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
    .step-dot.active{background:var(--pr);color:#fff}
    .step-dot.done{background:#16a34a;color:#fff}
    .step-line{flex:1;height:2px;background:#e2e8f0;margin:0 8px}
    .step-line.done{background:#16a34a}
  </style></head>
<body><div class="d-flex">
  <div class="col-md-2 sidebar p-0"><div class="p-4"><a href="/" class="text-white text-decoration-none"><h6 class="fw-bold mb-0"><i class="bi bi-heart-pulse me-2" style="color:#00b4d8"></i>MediBook</h6></a><small class="text-white-50">Doctor</small></div><nav class="nav flex-column"><a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a><a class="nav-link" href="/doctor/appointments"><i class="bi bi-calendar-check me-2"></i>Appointments</a><a class="nav-link active" href="/doctor/schedule"><i class="bi bi-clock me-2"></i>My Schedule</a><a class="nav-link" href="/doctor/profile"><i class="bi bi-person me-2"></i>Profile</a><a class="nav-link text-danger" href="/" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></nav></div>
  <div class="flex-grow-1">
    <div class="top-bar"><h6 class="fw-bold mb-0">My Schedule</h6><span id="uName" class="text-muted small"></span></div>
    <div class="main">
      <div class="alert-box"><div id="alertBox"></div></div>
      <div class="row g-4">
        <div class="col-md-8">
          <div class="card-s mb-4"><h6 class="fw-bold mb-3">Available Days</h6>
            <div class="d-flex flex-wrap gap-2" id="daysWrap">
              <div class="text-muted small">Loading...</div>
            </div>
          </div>
          <div class="card-s"><h6 class="fw-bold mb-3">Time Slots</h6>
            <div class="row g-2" id="slotsWrap"><div class="text-muted small col-12">Loading...</div></div>
          </div>
        </div>
        <div class="col-md-4"><div class="card-s">
          <h6 class="fw-bold mb-3"><i class="bi bi-gear me-2"></i>Update Availability</h6>
          <form id="availForm">
            <div class="mb-3"><label class="form-label small fw-500">Working Days</label>
              <div class="d-flex flex-wrap gap-2" id="dayCheckboxes"></div>
            </div>
            <div class="mb-3"><label class="form-label small fw-500">Add Time Slot (HH:MM)</label>
              <div class="input-group">
                <input type="time" class="form-control" id="newSlot">
                <button type="button" class="btn btn-outline-primary" onclick="addSlot()"><i class="bi bi-plus"></i></button>
              </div>
            </div>
            <div id="pendingSlots" class="mb-3"></div>
            <button type="submit" class="btn btn-primary w-100">Save Changes</button>
          </form>
        </div></div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  
  const token=localStorage.getItem('token');
  const user=JSON.parse(localStorage.getItem('user')||'{}');
  function logout(){localStorage.removeItem('token');localStorage.removeItem('user');window.location.href='/';}
  function showAlert(msg,type='success'){
    const box=document.getElementById('alertBox');
    box.innerHTML=`<div class="alert alert-${type} alert-dismissible shadow-sm">${msg}<button class="btn-close" data-bs-dismiss="alert"></button></div>`;
    setTimeout(()=>{const a=box.querySelector('.alert');if(a)a.remove();},4000);
  }
  function badge(status){
    const m={PENDING:'badge-pending',CONFIRMED:'badge-confirmed',COMPLETED:'badge-completed',CANCELLED:'badge-cancelled',NO_SHOW:'badge-no_show'};
    return `<span class="badge rounded-pill px-3 py-2 ${m[status]||'bg-secondary'}">${status.replace('_',' ')}</span>`;
  }
  async function apiFetch(url,opts={}){
    const r=await fetch(url,{headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},...opts});
    const d=await r.json();
    if(!d.success) throw new Error(d.message||'Request failed');
    return d.data;
  }
  if(!token||user.role!=='DOCTOR') window.location.href='/login';
  document.getElementById('uName').textContent=user.name;
  const DAYS=['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY','SUNDAY'];
  let profile={};let pendingSlots=new Set();
  async function load(){
    try{
      profile=await apiFetch('/api/doctor/profile');
      const days=profile.availableDays||[];
      const slots=profile.timeSlots||[];
      document.getElementById('daysWrap').innerHTML=DAYS.map(d=>`<span class="badge rounded-pill px-3 py-2 ${days.includes(d)?'bg-primary':'bg-light text-muted border'}">${d}</span>`).join('');
      document.getElementById('slotsWrap').innerHTML=slots.length?[...slots].sort().map(s=>`<div class="col-4 col-md-3"><div class="time-slot selected">${s}</div></div>`).join(''):'<p class="text-muted small col-12">No slots configured</p>';
      document.getElementById('dayCheckboxes').innerHTML=DAYS.map(d=>`<div class="form-check me-3"><input class="form-check-input" type="checkbox" id="d_${d}" value="${d}" ${days.includes(d)?'checked':''}><label class="form-check-label small" for="d_${d}">${d.slice(0,3)}</label></div>`).join('');
      pendingSlots=new Set(slots);renderPending();
    }catch(e){showAlert('Load failed','danger');}
  }
  function addSlot(){const s=document.getElementById('newSlot').value;if(!s)return;pendingSlots.add(s);renderPending();}
  function renderPending(){document.getElementById('pendingSlots').innerHTML=[...pendingSlots].sort().map(s=>`<span class="badge bg-primary me-1 mb-1 px-2 py-2">${s} <i class="bi bi-x ms-1" style="cursor:pointer" onclick="removeSlot('${s}')"></i></span>`).join('');}
  function removeSlot(s){pendingSlots.delete(s);renderPending();}
  document.getElementById('availForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const days=DAYS.filter(d=>document.getElementById('d_'+d)?.checked);
    const slots=[...pendingSlots];
    try{
      await apiFetch('/api/doctor/availability?'+days.map(d=>'availableDays='+d).join('&')+'&'+slots.map(s=>'timeSlots='+s).join('&'),{method:'PUT'});
      showAlert('Schedule updated!');load();
    }catch(e){showAlert(e.message,'danger');}
  });
  load();
</script></body></html>
