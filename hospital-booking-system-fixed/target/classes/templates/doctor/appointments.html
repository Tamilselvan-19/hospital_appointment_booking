<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Appointments – Doctor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--pr:#0a4d8c;--ac:#00b4d8;--dk:#071d34;--lt:#f0f7ff}
    body{font-family:'DM Sans',sans-serif;background:#f3f6fb}
    .sidebar{min-height:100vh;background:var(--dk)}
    .sidebar .nav-link{color:rgba(255,255,255,.75);padding:12px 20px;transition:.2s}
    .sidebar .nav-link:hover,.sidebar .nav-link.active{color:#fff;background:rgba(255,255,255,.1);border-left:3px solid var(--ac)}
    .top-bar{background:#fff;padding:14px 28px;box-shadow:0 1px 12px rgba(10,77,140,.06);display:flex;align-items:center;justify-content:space-between}
    .main{padding:28px;flex:1;overflow-y:auto}
    .card-s{border:none;border-radius:16px;background:#fff;box-shadow:0 2px 16px rgba(10,77,140,.07);padding:22px}
    .stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
    .table thead{background:var(--pr);color:#fff}
    .table thead th{border:none;padding:13px 16px;font-weight:500}
    .table tbody td{padding:12px 16px;vertical-align:middle}
    .table tbody tr:hover{background:#f8fbff}
    .badge-pending{background:#fff3cd;color:#856404}
    .badge-confirmed{background:#d1ecf1;color:#0c5460}
    .badge-completed{background:#d4edda;color:#155724}
    .badge-cancelled{background:#f8d7da;color:#721c24}
    .badge-no_show{background:#e2e3e5;color:#383d41}
    .form-control,.form-select{border-radius:10px;border:1.5px solid #e2e8f0}
    .form-control:focus,.form-select:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(10,77,140,.1)}
    .btn-primary{background:var(--pr);border:none;border-radius:10px}
    .btn-primary:hover{background:#0d5ea6}
    .alert-box{position:fixed;top:80px;right:24px;z-index:9999;min-width:300px}
    .time-slot{border:2px solid #e2e8f0;border-radius:10px;padding:10px;text-align:center;cursor:pointer;transition:.25s;font-weight:500}
    .time-slot:hover{border-color:var(--pr);background:var(--lt)}
    .time-slot.selected{border-color:var(--pr);background:var(--pr);color:#fff}
    .time-slot.unavailable{background:#fee2e2;border-color:#fca5a5;color:#991b1b;cursor:not-allowed}
    .doctor-card{border:none;border-radius:16px;box-shadow:0 2px 16px rgba(10,77,140,.07);transition:all .3s}
    .doctor-card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(10,77,140,.14)}
    .doc-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--pr),var(--ac));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6rem}
    .step-wrap{display:flex;align-items:center;margin-bottom:32px}
    .step-dot{width:36px;height:36px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
    .step-dot.active{background:var(--pr);color:#fff}
    .step-dot.done{background:#16a34a;color:#fff}
    .step-line{flex:1;height:2px;background:#e2e8f0;margin:0 8px}
    .step-line.done{background:#16a34a}
  </style></head>
<body><div class="d-flex">
  <div class="col-md-2 sidebar p-0"><div class="p-4"><a href="/" class="text-white text-decoration-none"><h6 class="fw-bold mb-0"><i class="bi bi-heart-pulse me-2" style="color:#00b4d8"></i>MediBook</h6></a><small class="text-white-50">Doctor</small></div><nav class="nav flex-column"><a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a><a class="nav-link active" href="/doctor/appointments"><i class="bi bi-calendar-check me-2"></i>Appointments</a><a class="nav-link" href="/doctor/schedule"><i class="bi bi-clock me-2"></i>My Schedule</a><a class="nav-link" href="/doctor/profile"><i class="bi bi-person me-2"></i>Profile</a><a class="nav-link text-danger" href="/" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></nav></div>
  <div class="flex-grow-1">
    <div class="top-bar"><h6 class="fw-bold mb-0">My Appointments</h6><span id="uName" class="text-muted small"></span></div>
    <div class="main">
      <div class="alert-box"><div id="alertBox"></div></div>
      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3"><div class="card-s text-center"><div class="fw-bold fs-4 text-primary" id="cToday">–</div><div class="text-muted small">Today</div></div></div>
        <div class="col-6 col-md-3"><div class="card-s text-center"><div class="fw-bold fs-4 text-warning" id="cPending">–</div><div class="text-muted small">Pending</div></div></div>
        <div class="col-6 col-md-3"><div class="card-s text-center"><div class="fw-bold fs-4 text-success" id="cDone">–</div><div class="text-muted small">Completed</div></div></div>
        <div class="col-6 col-md-3"><div class="card-s text-center"><div class="fw-bold fs-4 text-danger" id="cCanc">–</div><div class="text-muted small">Cancelled</div></div></div>
      </div>
      <div class="d-flex gap-2 mb-3">
        <select id="sf" class="form-select form-select-sm" style="width:150px" onchange="filter()">
          <option value="">All Status</option><option value="PENDING">Pending</option>
          <option value="CONFIRMED">Confirmed</option><option value="COMPLETED">Completed</option><option value="CANCELLED">Cancelled</option>
        </select>
      </div>
      <div class="card-s"><div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead><tr><th>ID</th><th>Patient</th><th>Date</th><th>Time</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="aTable"><tr><td colspan="7" class="text-center py-4 text-muted">Loading...</td></tr></tbody>
        </table>
      </div></div>
    </div>
  </div>
</div>
<!-- Complete Modal -->
<div class="modal fade" id="completeModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content rounded-4">
  <div class="modal-header"><h6 class="modal-title fw-bold">Complete Appointment</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <input type="hidden" id="cAptId">
    <div class="mb-3"><label class="form-label small fw-500">Diagnosis</label><textarea class="form-control" id="cDiag" rows="2" placeholder="Enter diagnosis..."></textarea></div>
    <div class="mb-3"><label class="form-label small fw-500">Prescription</label><textarea class="form-control" id="cPres" rows="3" placeholder="Enter prescription..."></textarea></div>
    <div class="mb-3"><label class="form-label small fw-500">Follow-up Date (optional)</label><input type="date" class="form-control" id="cFollowUp"></div>
  </div>
  <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-success" onclick="submitComplete()">Mark Complete</button></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  
  const token=localStorage.getItem('token');
  const user=JSON.parse(localStorage.getItem('user')||'{}');
  function logout(){localStorage.removeItem('token');localStorage.removeItem('user');window.location.href='/';}
  function showAlert(msg,type='success'){
    const box=document.getElementById('alertBox');
    box.innerHTML=`<div class="alert alert-${type} alert-dismissible shadow-sm">${msg}<button class="btn-close" data-bs-dismiss="alert"></button></div>`;
    setTimeout(()=>{const a=box.querySelector('.alert');if(a)a.remove();},4000);
  }
  function badge(status){
    const m={PENDING:'badge-pending',CONFIRMED:'badge-confirmed',COMPLETED:'badge-completed',CANCELLED:'badge-cancelled',NO_SHOW:'badge-no_show'};
    return `<span class="badge rounded-pill px-3 py-2 ${m[status]||'bg-secondary'}">${status.replace('_',' ')}</span>`;
  }
  async function apiFetch(url,opts={}){
    const r=await fetch(url,{headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},...opts});
    const d=await r.json();
    if(!d.success) throw new Error(d.message||'Request failed');
    return d.data;
  }
  if(!token||user.role!=='DOCTOR') window.location.href='/login';
  document.getElementById('uName').textContent=user.name;
  let all=[];
  async function load(){
    try{all=await apiFetch('/api/doctor/appointments/all');stats(all);filter();}
    catch(e){showAlert('Load failed','danger');}
  }
  function stats(a){
    const t=new Date().toISOString().split('T')[0];
    document.getElementById('cToday').textContent=a.filter(x=>x.appointmentDate===t).length;
    document.getElementById('cPending').textContent=a.filter(x=>x.status==='PENDING').length;
    document.getElementById('cDone').textContent=a.filter(x=>x.status==='COMPLETED').length;
    document.getElementById('cCanc').textContent=a.filter(x=>x.status==='CANCELLED').length;
  }
  function filter(){
    const st=document.getElementById('sf').value;
    render(st?all.filter(a=>a.status===st):all);
  }
  function render(data){
    const tb=document.getElementById('aTable');
    if(!data.length){tb.innerHTML='<tr><td colspan="7" class="text-center py-4 text-muted">No appointments</td></tr>';return;}
    tb.innerHTML=data.map(a=>`
      <tr>
        <td class="text-muted small">#${a.id}</td>
        <td class="fw-500">${a.patientName}<br><span class="text-muted small">${a.patientPhone||''}</span></td>
        <td>${a.appointmentDate}</td><td>${a.appointmentTime}</td>
        <td><span class="badge bg-light text-dark border">${a.appointmentType}</span></td>
        <td>${badge(a.status)}</td>
        <td>
          ${a.status==='PENDING'?`<button class="btn btn-sm btn-outline-success me-1" onclick="confirm_(${a.id})"><i class="bi bi-check"></i></button><button class="btn btn-sm btn-outline-danger" onclick="cancel(${a.id})"><i class="bi bi-x"></i></button>`:''}
          ${a.status==='CONFIRMED'?`<button class="btn btn-sm btn-outline-primary me-1" onclick="openComplete(${a.id})"><i class="bi bi-check-all"></i></button><button class="btn btn-sm btn-outline-secondary" onclick="noShow(${a.id})"><i class="bi bi-person-dash"></i></button>`:''}
        </td>
      </tr>`).join('');
  }
  async function confirm_(id){
    try{await apiFetch('/api/appointments/'+id+'/confirm',{method:'PUT'});showAlert('Confirmed!');load();}
    catch(e){showAlert(e.message,'danger');}
  }
  async function cancel(id){
    if(!confirm('Cancel this appointment?'))return;
    try{await apiFetch('/api/appointments/'+id+'/cancel?reason=Cancelled+by+doctor',{method:'PUT'});showAlert('Cancelled');load();}
    catch(e){showAlert(e.message,'danger');}
  }
  async function noShow(id){
    try{await apiFetch('/api/appointments/'+id+'/no-show',{method:'PUT'});showAlert('Marked no-show');load();}
    catch(e){showAlert(e.message,'danger');}
  }
  function openComplete(id){document.getElementById('cAptId').value=id;document.getElementById('cDiag').value='';document.getElementById('cPres').value='';document.getElementById('cFollowUp').value='';new bootstrap.Modal(document.getElementById('completeModal')).show();}
  async function submitComplete(){
    const id=document.getElementById('cAptId').value;
    let url='/api/appointments/'+id+'/complete?';
    const d=document.getElementById('cDiag').value;
    const p=document.getElementById('cPres').value;
    const f=document.getElementById('cFollowUp').value;
    if(d) url+='diagnosis='+encodeURIComponent(d)+'&';
    if(p) url+='prescription='+encodeURIComponent(p)+'&';
    if(f) url+='followUpDate='+f;
    try{await apiFetch(url,{method:'PUT'});bootstrap.Modal.getInstance(document.getElementById('completeModal')).hide();showAlert('Marked complete!');load();}
    catch(e){showAlert(e.message,'danger');}
  }
  load();
</script></body></html>
