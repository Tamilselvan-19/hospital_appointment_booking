<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register – MediBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--pr:#0a4d8c;--ac:#00b4d8;--dk:#071d34}
    body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#071d34 0%,#0a4d8c 55%,#00b4d8 100%);min-height:100vh;display:flex;align-items:center;padding:40px 0}
    .card{border:none;border-radius:24px;box-shadow:0 24px 64px rgba(7,29,52,.4)}
    .brand{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:var(--pr)}
    .btn-primary{background:var(--pr);border:none;padding:12px;border-radius:12px;font-weight:600}
    .btn-primary:hover{background:#0d5ea6}
    .form-control,.form-select{border-radius:12px;border:1.5px solid #e2e8f0;padding:12px 16px}
    .form-control:focus,.form-select:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(10,77,140,.12)}
    .role-tab{cursor:pointer;border:2px solid #e2e8f0;border-radius:12px;padding:12px 20px;text-align:center;transition:.2s}
    .role-tab.active{border-color:var(--pr);background:#f0f7ff;color:var(--pr)}
    .role-tab i{font-size:1.5rem;display:block;margin-bottom:4px}
    .section-title{font-size:.85rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin:20px 0 12px}
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card p-5">
        <div class="text-center mb-4">
          <div class="brand mb-1"><i class="bi bi-heart-pulse me-2" style="color:var(--ac)"></i>MediBook</div>
          <h5 class="fw-bold mb-1">Create Account</h5>
          <p class="text-muted small">Join MediBook to manage your health appointments</p>
        </div>
        <div id="alertBox"></div>

        <!-- Role Selection -->
        <div class="section-title">I am registering as</div>
        <div class="row g-2 mb-4">
          <div class="col-6">
            <div class="role-tab active" id="tab-PATIENT" onclick="setRole('PATIENT')">
              <i class="bi bi-person-heart"></i>Patient
            </div>
          </div>
          <div class="col-6">
            <div class="role-tab" id="tab-DOCTOR" onclick="setRole('DOCTOR')">
              <i class="bi bi-person-badge"></i>Doctor
            </div>
          </div>
        </div>

        <form id="registerForm">
          <input type="hidden" id="roleInput" value="PATIENT">

          <div class="section-title">Basic Information</div>
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label small fw-500">Full Name *</label>
              <input type="text" class="form-control" id="name" placeholder="Dr. John Smith" required minlength="2">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-500">Email Address *</label>
              <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-500">Phone Number *</label>
              <input type="tel" class="form-control" id="phoneNumber" placeholder="10-digit mobile" required minlength="10" maxlength="15">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-500">Password *</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password" placeholder="Min 6 characters" required minlength="6">
                <button class="btn btn-outline-secondary" type="button" onclick="togglePw('password','eye1')" style="border-radius:0 12px 12px 0"><i id="eye1" class="bi bi-eye"></i></button>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-500">Confirm Password *</label>
              <div class="input-group">
                <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat password" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePw('confirmPassword','eye2')" style="border-radius:0 12px 12px 0"><i id="eye2" class="bi bi-eye"></i></button>
              </div>
            </div>
          </div>

          <!-- Doctor fields -->
          <div id="doctorFields" style="display:none">
            <div class="section-title">Professional Details</div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-500">Specialization *</label>
                <select class="form-select" id="specialization">
                  <option value="">Select specialization</option>
                  <option>Cardiology</option><option>Dermatology</option><option>Neurology</option>
                  <option>Orthopedics</option><option>Pediatrics</option><option>Psychiatry</option>
                  <option>General Surgery</option><option>Gynecology</option><option>Ophthalmology</option>
                  <option>ENT</option><option>Radiology</option><option>Oncology</option><option>General Medicine</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-500">Qualification *</label>
                <input type="text" class="form-control" id="qualification" placeholder="e.g. MBBS, MD">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-500">Experience (Years)</label>
                <input type="number" class="form-control" id="experienceYears" placeholder="0" min="0" max="60">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-500">Consultation Fee (₹)</label>
                <input type="number" class="form-control" id="consultationFee" placeholder="500" min="0">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-500">License Number *</label>
                <input type="text" class="form-control" id="licenseNumber" placeholder="MCI12345">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-500">Department</label>
                <input type="text" class="form-control" id="department" placeholder="e.g. Cardiology">
              </div>
            </div>
          </div>

          <!-- Patient fields -->
          <div id="patientFields">
            <div class="section-title">Personal Details (Optional)</div>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-500">Date of Birth</label>
                <input type="date" class="form-control" id="dateOfBirth">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-500">Gender</label>
                <select class="form-select" id="gender">
                  <option value="">Select gender</option>
                  <option>MALE</option><option>FEMALE</option><option>OTHER</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-500">Blood Group</label>
                <select class="form-select" id="bloodGroup">
                  <option value="">Select blood group</option>
                  <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                  <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-500">Address</label>
                <input type="text" class="form-control" id="address" placeholder="Your address">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-500">Emergency Contact Name</label>
                <input type="text" class="form-control" id="emergencyContactName" placeholder="Relative's name">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-500">Emergency Contact Phone</label>
                <input type="tel" class="form-control" id="emergencyContactPhone" placeholder="10-digit number">
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 mt-4" id="registerBtn">
            <span id="registerSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span>
            Create Account
          </button>
        </form>

        <div class="text-center mt-4 small">
          Already have an account? <a href="/login" class="text-decoration-none fw-600">Sign in here</a><br>
          <a href="/" class="text-muted text-decoration-none mt-1 d-inline-block">← Back to Home</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function setRole(role){
    document.getElementById('roleInput').value=role;
    ['PATIENT','DOCTOR'].forEach(r=>document.getElementById('tab-'+r).classList.remove('active'));
    document.getElementById('tab-'+role).classList.add('active');
    document.getElementById('doctorFields').style.display=(role==='DOCTOR')?'block':'none';
    document.getElementById('patientFields').style.display=(role==='PATIENT')?'block':'none';
  }
  function togglePw(id,iconId){
    const i=document.getElementById(id);const e=document.getElementById(iconId);
    if(i.type==='password'){i.type='text';e.className='bi bi-eye-slash';}
    else{i.type='password';e.className='bi bi-eye';}
  }
  function showAlert(msg,type='danger'){
    document.getElementById('alertBox').innerHTML=
      `<div class="alert alert-${type} alert-dismissible fade show py-2"><small>${msg}</small>
       <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
  }
  document.getElementById('registerForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const pw=document.getElementById('password').value;
    const cpw=document.getElementById('confirmPassword').value;
    if(pw!==cpw){showAlert('Passwords do not match');return;}
    const btn=document.getElementById('registerBtn');
    const sp=document.getElementById('registerSpinner');
    btn.disabled=true;sp.classList.remove('d-none');
    const role=document.getElementById('roleInput').value;
    const payload={
      name:document.getElementById('name').value,
      email:document.getElementById('email').value,
      password:pw,
      phoneNumber:document.getElementById('phoneNumber').value,
      role:role
    };
    if(role==='DOCTOR'){
      payload.specialization=document.getElementById('specialization').value||'General';
      payload.qualification=document.getElementById('qualification').value||'MBBS';
      payload.experienceYears=parseInt(document.getElementById('experienceYears').value)||0;
      payload.consultationFee=parseFloat(document.getElementById('consultationFee').value)||0;
      payload.licenseNumber=document.getElementById('licenseNumber').value;
      payload.department=document.getElementById('department').value;
    } else if(role==='PATIENT'){
      payload.dateOfBirth=document.getElementById('dateOfBirth').value||null;
      payload.gender=document.getElementById('gender').value||null;
      payload.bloodGroup=document.getElementById('bloodGroup').value||null;
      payload.address=document.getElementById('address').value||null;
      payload.emergencyContactName=document.getElementById('emergencyContactName').value||null;
      payload.emergencyContactPhone=document.getElementById('emergencyContactPhone').value||null;
    }
    try{
      const r=await fetch('/api/auth/register',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
      const data=await r.json();
      if(data.success){
        showAlert('Registration successful! Redirecting to login...','success');
        setTimeout(()=>window.location.href='/login',1500);
      } else {
        showAlert(data.message||'Registration failed. Please try again.');
      }
    }catch(err){
      showAlert('Network error. Please check your connection.');
    }finally{
      btn.disabled=false;sp.classList.add('d-none');
    }
  });
</script>
</body>
</html>
