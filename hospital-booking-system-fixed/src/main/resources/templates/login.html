<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login – MediBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--pr:#0a4d8c;--ac:#00b4d8;--dk:#071d34}
    body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#071d34 0%,#0a4d8c 55%,#00b4d8 100%);min-height:100vh;display:flex;align-items:center}
    .card{border:none;border-radius:24px;box-shadow:0 24px 64px rgba(7,29,52,.4)}
    .brand{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:var(--pr)}
    .btn-primary{background:var(--pr);border:none;padding:12px;border-radius:12px;font-weight:600}
    .btn-primary:hover{background:#0d5ea6}
    .form-control{border-radius:12px;border:1.5px solid #e2e8f0;padding:12px 16px}
    .form-control:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(10,77,140,.12)}
    .demo-box{background:#f0f7ff;border-radius:12px;padding:16px;font-size:.85rem}
    .demo-box code{background:#dde8f5;padding:2px 6px;border-radius:6px;font-size:.8rem}
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card p-5">
        <div class="text-center mb-4">
          <div class="brand mb-1"><i class="bi bi-heart-pulse me-2" style="color:var(--ac)"></i>MediBook</div>
          <h5 class="fw-bold mb-1">Welcome Back</h5>
          <p class="text-muted small">Sign in to your account</p>
        </div>
        <div id="alertBox"></div>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label fw-500 small">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
          </div>
          <div class="mb-4">
            <label class="form-label fw-500 small">Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="password" placeholder="••••••••" required>
              <button class="btn btn-outline-secondary" type="button" onclick="togglePw()" style="border-radius:0 12px 12px 0">
                <i class="bi bi-eye" id="eyeIcon"></i></button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="loginBtn">
            <span id="loginSpinner" class="spinner-border spinner-border-sm me-2 d-none"></span>Sign In
          </button>
        </form>
        <div class="demo-box mt-4">
          <div class="fw-600 mb-2">Demo Accounts</div>
          <div class="mb-1">Doctor: <code>doctor@hospital.com</code> / <code>doctor123</code></div>
          <div>Patient: <code>patient@hospital.com</code> / <code>patient123</code></div>
        </div>
        <div class="text-center mt-4 small">
          No account? <a href="/register" class="text-decoration-none fw-600">Register here</a><br>
          <a href="/" class="text-muted text-decoration-none mt-1 d-inline-block">← Back to Home</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function togglePw(){
    const i=document.getElementById('password');
    const e=document.getElementById('eyeIcon');
    if(i.type==='password'){i.type='text';e.className='bi bi-eye-slash';}
    else{i.type='password';e.className='bi bi-eye';}
  }
  document.getElementById('loginForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const btn=document.getElementById('loginBtn');
    const sp=document.getElementById('loginSpinner');
    btn.disabled=true;sp.classList.remove('d-none');
    try{
      const r=await fetch('/api/auth/login',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})
      });
      const d=await r.json();
      if(d.success){
        localStorage.setItem('token',d.data.token);
        localStorage.setItem('user',JSON.stringify(d.data));
        window.location.href='/dashboard';
      } else {
        document.getElementById('alertBox').innerHTML =
          '<div class="alert alert-danger py-2 small">'+(d.message||'Login failed. Please check your credentials.')+'</div>';
        btn.disabled=false; sp.classList.add('d-none');
      }
    } catch(err) {
      document.getElementById('alertBox').innerHTML =
        '<div class="alert alert-danger py-2 small">Something went wrong. Please try again.</div>';
      btn.disabled=false; sp.classList.add('d-none');
    }
  });
</script>
</body>
</html>
