<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--pr:#0a4d8c;--ac:#00b4d8;--dk:#071d34;--lt:#f0f7ff}
    body{font-family:'DM Sans',sans-serif;background:#f3f6fb}
    .sidebar{min-height:100vh;background:var(--dk)}
    .sidebar .nav-link{color:rgba(255,255,255,.75);padding:12px 20px;transition:.2s}
    .sidebar .nav-link:hover,.sidebar .nav-link.active{color:#fff;background:rgba(255,255,255,.1);border-left:3px solid var(--ac)}
    .top-bar{background:#fff;padding:14px 28px;box-shadow:0 1px 12px rgba(10,77,140,.06);display:flex;align-items:center;justify-content:space-between}
    .main{padding:28px;flex:1;overflow-y:auto}
    .card-s{border:none;border-radius:16px;background:#fff;box-shadow:0 2px 16px rgba(10,77,140,.07);padding:22px}
    .stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
    .table thead{background:var(--pr);color:#fff}
    .table thead th{border:none;padding:13px 16px;font-weight:500}
    .table tbody td{padding:12px 16px;vertical-align:middle}
    .table tbody tr:hover{background:#f8fbff}
    .badge-pending{background:#fff3cd;color:#856404}
    .badge-confirmed{background:#d1ecf1;color:#0c5460}
    .badge-completed{background:#d4edda;color:#155724}
    .badge-cancelled{background:#f8d7da;color:#721c24}
    .badge-no_show{background:#e2e3e5;color:#383d41}
    .form-control,.form-select{border-radius:10px;border:1.5px solid #e2e8f0}
    .form-control:focus,.form-select:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(10,77,140,.1)}
    .btn-primary{background:var(--pr);border:none;border-radius:10px}
    .btn-primary:hover{background:#0d5ea6}
    .alert-box{position:fixed;top:80px;right:24px;z-index:9999;min-width:300px}
    .time-slot{border:2px solid #e2e8f0;border-radius:10px;padding:10px;text-align:center;cursor:pointer;transition:.25s;font-weight:500}
    .time-slot:hover{border-color:var(--pr);background:var(--lt)}
    .time-slot.selected{border-color:var(--pr);background:var(--pr);color:#fff}
    .time-slot.unavailable{background:#fee2e2;border-color:#fca5a5;color:#991b1b;cursor:not-allowed}
    .doctor-card{border:none;border-radius:16px;box-shadow:0 2px 16px rgba(10,77,140,.07);transition:all .3s}
    .doctor-card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(10,77,140,.14)}
    .doc-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--pr),var(--ac));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6rem}
    .step-wrap{display:flex;align-items:center;margin-bottom:32px}
    .step-dot{width:36px;height:36px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
    .step-dot.active{background:var(--pr);color:#fff}
    .step-dot.done{background:#16a34a;color:#fff}
    .step-line{flex:1;height:2px;background:#e2e8f0;margin:0 8px}
    .step-line.done{background:#16a34a}
  </style></head>
<body><div class="d-flex">
  <div class="col-md-2 sidebar p-0"><div class="p-4"><a href="/" class="text-white text-decoration-none"><h6 class="fw-bold mb-0"><i class="bi bi-heart-pulse me-2" style="color:#00b4d8"></i>MediBook</h6></a><small class="text-white-50">Patient</small></div><nav class="nav flex-column"><a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a><a class="nav-link" href="/patient/find-doctors"><i class="bi bi-search me-2"></i>Find Doctors</a><a class="nav-link" href="/patient/book-appointment"><i class="bi bi-plus-circle me-2"></i>Book Appointment</a><a class="nav-link" href="/patient/my-appointments"><i class="bi bi-calendar-check me-2"></i>My Appointments</a><a class="nav-link active" href="/patient/profile"><i class="bi bi-person me-2"></i>Profile</a><a class="nav-link text-danger" href="/" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></nav></div>
  <div class="flex-grow-1">
    <div class="top-bar"><h6 class="fw-bold mb-0">My Profile</h6><span id="uName" class="text-muted small"></span></div>
    <div class="main">
      <div class="alert-box"><div id="alertBox"></div></div>
      <div class="row mb-4"><div class="col-12"><div class="p-4 rounded-4 text-white" style="background:linear-gradient(135deg,#071d34,#0a4d8c)">
        <div class="d-flex align-items-center gap-4">
          <div class="doc-avatar"><i class="bi bi-person-heart"></i></div>
          <div><h4 class="fw-bold mb-0" id="hName">–</h4><div class="opacity-75" id="hEmail">–</div></div>
          <div class="ms-auto"><button class="btn btn-light" onclick="toggleEdit()"><i class="bi bi-pencil me-2"></i>Edit</button></div>
        </div>
      </div></div></div>
      <div class="row g-4">
        <div class="col-md-8"><div class="card-s"><h6 class="fw-bold mb-4">Personal Information</h6>
          <form id="profForm">
            <div class="row g-3 mb-3">
              <div class="col-md-6"><label class="form-label small fw-500">Full Name</label><input class="form-control" id="pName" readonly></div>
              <div class="col-md-6"><label class="form-label small fw-500">Email</label><input class="form-control" id="pEmail" readonly></div>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6"><label class="form-label small fw-500">Phone</label><input class="form-control" id="pPhone" readonly></div>
              <div class="col-md-6"><label class="form-label small fw-500">Date of Birth</label><input type="date" class="form-control" id="pDob" readonly></div>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-md-6"><label class="form-label small fw-500">Gender</label>
                <select class="form-select" id="pGender" disabled><option value="">Select</option><option value="MALE">Male</option><option value="FEMALE">Female</option><option value="OTHER">Other</option></select>
              </div>
              <div class="col-md-6"><label class="form-label small fw-500">Blood Group</label>
                <select class="form-select" id="pBlood" disabled><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select>
              </div>
            </div>
            <div class="mb-3"><label class="form-label small fw-500">Address</label><textarea class="form-control" id="pAddr" rows="2" readonly></textarea></div>
            <div class="row g-3 mb-3">
              <div class="col-md-6"><label class="form-label small fw-500">Emergency Contact Name</label><input class="form-control" id="pEcName" readonly></div>
              <div class="col-md-6"><label class="form-label small fw-500">Emergency Contact Phone</label><input class="form-control" id="pEcPhone" readonly></div>
            </div>
            <div class="mb-3"><label class="form-label small fw-500">Allergies</label><input class="form-control" id="pAllergies" readonly></div>
            <div id="editBtns" class="d-none"><button type="submit" class="btn btn-primary me-2">Save Changes</button><button type="button" class="btn btn-secondary" onclick="toggleEdit()">Cancel</button></div>
          </form>
        </div></div>
        <div class="col-md-4">
          <div class="card-s mb-4"><h6 class="fw-bold mb-3">Medical Info</h6>
            <div class="d-flex justify-content-between mb-2"><span class="text-muted small">Blood Group</span><span class="fw-bold" id="sBG">–</span></div>
            <div class="d-flex justify-content-between mb-2"><span class="text-muted small">Allergies</span><span class="fw-bold small" id="sAlg">–</span></div>
            <div class="d-flex justify-content-between"><span class="text-muted small">Premium</span><span id="sPrem" class="badge">–</span></div>
          </div>
          <div class="card-s"><h6 class="fw-bold mb-3">Account</h6>
            <button class="btn btn-outline-primary w-100 mb-2 rounded-pill" onclick="changePw()"><i class="bi bi-key me-2"></i>Change Password</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  
  const token=localStorage.getItem('token');
  const user=JSON.parse(localStorage.getItem('user')||'{}');
  function logout(){localStorage.removeItem('token');localStorage.removeItem('user');window.location.href='/';}
  function showAlert(msg,type='success'){
    const box=document.getElementById('alertBox');
    box.innerHTML=`<div class="alert alert-${type} alert-dismissible shadow-sm">${msg}<button class="btn-close" data-bs-dismiss="alert"></button></div>`;
    setTimeout(()=>{const a=box.querySelector('.alert');if(a)a.remove();},4000);
  }
  function badge(status){
    const m={PENDING:'badge-pending',CONFIRMED:'badge-confirmed',COMPLETED:'badge-completed',CANCELLED:'badge-cancelled',NO_SHOW:'badge-no_show'};
    return `<span class="badge rounded-pill px-3 py-2 ${m[status]||'bg-secondary'}">${status.replace('_',' ')}</span>`;
  }
  async function apiFetch(url,opts={}){
    const r=await fetch(url,{headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},...opts});
    const d=await r.json();
    if(!d.success) throw new Error(d.message||'Request failed');
    return d.data;
  }
  if(!token||user.role!=='PATIENT') window.location.href='/login';
  document.getElementById('uName').textContent=user.name;
  let editing=false;
  async function load(){
    try{
      const p=await apiFetch('/api/patient/profile');
      document.getElementById('hName').textContent=p.name;document.getElementById('hEmail').textContent=p.email;
      document.getElementById('pName').value=p.name||'';document.getElementById('pEmail').value=p.email||'';
      document.getElementById('pPhone').value=p.phoneNumber||'';document.getElementById('pDob').value=p.dateOfBirth||'';
      document.getElementById('pGender').value=p.gender||'';document.getElementById('pBlood').value=p.bloodGroup||'';
      document.getElementById('pAddr').value=p.address||'';document.getElementById('pEcName').value=p.emergencyContactName||'';
      document.getElementById('pEcPhone').value=p.emergencyContactPhone||'';document.getElementById('pAllergies').value=p.allergies||'';
      document.getElementById('sBG').textContent=p.bloodGroup||'–';
      document.getElementById('sAlg').textContent=p.allergies||'None';
      document.getElementById('sPrem').textContent=p.isPremium?'Premium':'Standard';
      document.getElementById('sPrem').className='badge '+(p.isPremium?'bg-warning text-dark':'bg-secondary');
    }catch(e){showAlert('Load failed','danger');}
  }
  function toggleEdit(){
    editing=!editing;
    ['pName','pPhone','pDob','pAddr','pEcName','pEcPhone','pAllergies'].forEach(id=>{const el=document.getElementById(id);if(el)el.readOnly=!editing;});
    ['pGender','pBlood'].forEach(id=>{const el=document.getElementById(id);if(el)el.disabled=!editing;});
    document.getElementById('editBtns').classList.toggle('d-none',!editing);
  }
  document.getElementById('profForm').addEventListener('submit',async e=>{
    e.preventDefault();
    try{
      await apiFetch('/api/patient/profile',{method:'PUT',body:JSON.stringify({
        dateOfBirth:document.getElementById('pDob').value||null,
        gender:document.getElementById('pGender').value||null,
        bloodGroup:document.getElementById('pBlood').value||null,
        address:document.getElementById('pAddr').value,
        emergencyContactName:document.getElementById('pEcName').value,
        emergencyContactPhone:document.getElementById('pEcPhone').value,
        allergies:document.getElementById('pAllergies').value,
        user:{name:document.getElementById('pName').value,phoneNumber:document.getElementById('pPhone').value}
      })});
      showAlert('Profile saved!');toggleEdit();load();
    }catch(e){showAlert(e.message,'danger');}
  });
  async function changePw(){
    const old=prompt('Current password:');
    if(!old)return;
    const n=prompt('New password (min 6 chars):');
    if(!n||n.length<6){showAlert('Password too short','warning');return;}
    try{
      await apiFetch('/api/auth/change-password',{method:'POST',body:JSON.stringify({oldPassword:old,newPassword:n})});
      showAlert('Password changed!');
    }catch(e){showAlert(e.message,'danger');}
  }
  load();
</script></body></html>
