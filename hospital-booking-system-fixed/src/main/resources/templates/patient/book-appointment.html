<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Appointment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--pr:#0a4d8c;--ac:#00b4d8;--dk:#071d34;--lt:#f0f7ff}
    body{font-family:'DM Sans',sans-serif;background:#f3f6fb}
    .sidebar{min-height:100vh;background:var(--dk)}
    .sidebar .nav-link{color:rgba(255,255,255,.75);padding:12px 20px;transition:.2s}
    .sidebar .nav-link:hover,.sidebar .nav-link.active{color:#fff;background:rgba(255,255,255,.1);border-left:3px solid var(--ac)}
    .top-bar{background:#fff;padding:14px 28px;box-shadow:0 1px 12px rgba(10,77,140,.06);display:flex;align-items:center;justify-content:space-between}
    .main{padding:28px;flex:1;overflow-y:auto}
    .card-s{border:none;border-radius:16px;background:#fff;box-shadow:0 2px 16px rgba(10,77,140,.07);padding:22px}
    .stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
    .table thead{background:var(--pr);color:#fff}
    .table thead th{border:none;padding:13px 16px;font-weight:500}
    .table tbody td{padding:12px 16px;vertical-align:middle}
    .table tbody tr:hover{background:#f8fbff}
    .badge-pending{background:#fff3cd;color:#856404}
    .badge-confirmed{background:#d1ecf1;color:#0c5460}
    .badge-completed{background:#d4edda;color:#155724}
    .badge-cancelled{background:#f8d7da;color:#721c24}
    .badge-no_show{background:#e2e3e5;color:#383d41}
    .form-control,.form-select{border-radius:10px;border:1.5px solid #e2e8f0}
    .form-control:focus,.form-select:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(10,77,140,.1)}
    .btn-primary{background:var(--pr);border:none;border-radius:10px}
    .btn-primary:hover{background:#0d5ea6}
    .alert-box{position:fixed;top:80px;right:24px;z-index:9999;min-width:300px}
    .time-slot{border:2px solid #e2e8f0;border-radius:10px;padding:10px;text-align:center;cursor:pointer;transition:.25s;font-weight:500}
    .time-slot:hover{border-color:var(--pr);background:var(--lt)}
    .time-slot.selected{border-color:var(--pr);background:var(--pr);color:#fff}
    .time-slot.unavailable{background:#fee2e2;border-color:#fca5a5;color:#991b1b;cursor:not-allowed}
    .doctor-card{border:none;border-radius:16px;box-shadow:0 2px 16px rgba(10,77,140,.07);transition:all .3s}
    .doctor-card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(10,77,140,.14)}
    .doc-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--pr),var(--ac));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6rem}
    .step-wrap{display:flex;align-items:center;margin-bottom:32px}
    .step-dot{width:36px;height:36px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
    .step-dot.active{background:var(--pr);color:#fff}
    .step-dot.done{background:#16a34a;color:#fff}
    .step-line{flex:1;height:2px;background:#e2e8f0;margin:0 8px}
    .step-line.done{background:#16a34a}
  </style></head>
<body><div class="d-flex">
  <div class="col-md-2 sidebar p-0"><div class="p-4"><a href="/" class="text-white text-decoration-none"><h6 class="fw-bold mb-0"><i class="bi bi-heart-pulse me-2" style="color:#00b4d8"></i>MediBook</h6></a><small class="text-white-50">Patient</small></div><nav class="nav flex-column"><a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a><a class="nav-link" href="/patient/find-doctors"><i class="bi bi-search me-2"></i>Find Doctors</a><a class="nav-link active" href="/patient/book-appointment"><i class="bi bi-plus-circle me-2"></i>Book Appointment</a><a class="nav-link" href="/patient/my-appointments"><i class="bi bi-calendar-check me-2"></i>My Appointments</a><a class="nav-link" href="/patient/profile"><i class="bi bi-person me-2"></i>Profile</a><a class="nav-link text-danger" href="/" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></nav></div>
  <div class="flex-grow-1">
    <div class="top-bar"><h6 class="fw-bold mb-0">Book Appointment</h6><span id="uName" class="text-muted small"></span></div>
    <div class="main">
      <div class="alert-box"><div id="alertBox"></div></div>
      <!-- Steps -->
      <div class="step-wrap mb-4">
        <div class="step-dot active" id="sd1">1</div><div class="step-line" id="sl1"></div>
        <div class="step-dot" id="sd2">2</div><div class="step-line" id="sl2"></div>
        <div class="step-dot" id="sd3">3</div><div class="step-line" id="sl3"></div>
        <div class="step-dot" id="sd4">4</div>
      </div>
      <div class="card-s">
        <!-- Step 1: Select Doctor -->
        <div id="step1">
          <h6 class="fw-bold mb-3">Select a Doctor</h6>
          <input type="text" id="docSearch" class="form-control mb-3" placeholder="Search by name or specialization..." oninput="filterDocs()">
          <div class="row g-3" id="docList"><div class="text-center col-12 py-4"><div class="spinner-border text-primary"></div></div></div>
          <div class="mt-4 text-end"><button class="btn btn-primary rounded-pill px-4" onclick="goStep(2)" id="s1Btn" disabled>Next →</button></div>
        </div>
        <!-- Step 2: Date -->
        <div id="step2" style="display:none">
          <h6 class="fw-bold mb-3">Select Date</h6>
          <div class="row justify-content-center"><div class="col-md-5">
            <input type="date" class="form-control form-control-lg" id="aptDate" onchange="onDateChange()">
            <div id="dateDisplay" class="mt-2"></div>
          </div></div>
          <div class="mt-4 d-flex justify-content-between"><button class="btn btn-secondary rounded-pill px-4" onclick="goStep(1)">← Back</button><button class="btn btn-primary rounded-pill px-4" onclick="goStep(3)" id="s2Btn" disabled>Next →</button></div>
        </div>
        <!-- Step 3: Time -->
        <div id="step3" style="display:none">
          <h6 class="fw-bold mb-3">Select Time Slot</h6>
          <div class="row g-2" id="slotGrid"><div class="text-muted">Loading slots...</div></div>
          <div class="mt-4 d-flex justify-content-between"><button class="btn btn-secondary rounded-pill px-4" onclick="goStep(2)">← Back</button><button class="btn btn-primary rounded-pill px-4" onclick="goStep(4)" id="s3Btn" disabled>Next →</button></div>
        </div>
        <!-- Step 4: Confirm -->
        <div id="step4" style="display:none">
          <h6 class="fw-bold mb-3">Confirm Booking</h6>
          <div class="p-4 rounded-3 mb-4" style="background:var(--lt)">
            <table class="table table-borderless mb-0">
              <tr><td class="text-muted">Doctor</td><td id="sumDoc" class="fw-bold">–</td></tr>
              <tr><td class="text-muted">Date</td><td id="sumDate" class="fw-bold">–</td></tr>
              <tr><td class="text-muted">Time</td><td id="sumTime" class="fw-bold">–</td></tr>
              <tr><td class="text-muted">Fee</td><td id="sumFee" class="fw-bold text-primary">–</td></tr>
              <tr><td class="text-muted">Type</td><td><select class="form-select form-select-sm" id="aptType" style="width:auto"><option value="REGULAR">General Consultation</option><option value="FOLLOW_UP">Follow-up</option><option value="EMERGENCY">Emergency</option></select></td></tr>
            </table>
          </div>
          <div class="mb-4"><label class="form-label fw-500 small">Symptoms / Reason for Visit</label><textarea class="form-control" id="symptoms" rows="3" placeholder="Describe your symptoms..."></textarea></div>
          <div class="d-flex justify-content-between"><button class="btn btn-secondary rounded-pill px-4" onclick="goStep(3)">← Back</button><button class="btn btn-success rounded-pill px-4" onclick="confirmBooking()"><i class="bi bi-check-circle me-2"></i>Confirm Booking</button></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  
  const token=localStorage.getItem('token');
  const user=JSON.parse(localStorage.getItem('user')||'{}');
  function logout(){localStorage.removeItem('token');localStorage.removeItem('user');window.location.href='/';}
  function showAlert(msg,type='success'){
    const box=document.getElementById('alertBox');
    box.innerHTML=`<div class="alert alert-${type} alert-dismissible shadow-sm">${msg}<button class="btn-close" data-bs-dismiss="alert"></button></div>`;
    setTimeout(()=>{const a=box.querySelector('.alert');if(a)a.remove();},4000);
  }
  function badge(status){
    const m={PENDING:'badge-pending',CONFIRMED:'badge-confirmed',COMPLETED:'badge-completed',CANCELLED:'badge-cancelled',NO_SHOW:'badge-no_show'};
    return `<span class="badge rounded-pill px-3 py-2 ${m[status]||'bg-secondary'}">${status.replace('_',' ')}</span>`;
  }
  async function apiFetch(url,opts={}){
    const r=await fetch(url,{headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},...opts});
    const d=await r.json();
    if(!d.success) throw new Error(d.message||'Request failed');
    return d.data;
  }
  if(!token||user.role!=='PATIENT') window.location.href='/login';
  document.getElementById('uName').textContent=user.name;
  document.getElementById('aptDate').min=new Date().toISOString().split('T')[0];
  let allDocs=[],selDoc=null,selTime=null,cur=1;
  // BUG FIX: endpoint was /api/patient/doctors → corrected to /api/doctors
  async function load(){
    try{allDocs=await apiFetch('/api/doctors');renderDocs(allDocs);}
    catch(e){showAlert('Load failed','danger');}
  }
  function filterDocs(){const kw=document.getElementById('docSearch').value.toLowerCase();renderDocs(allDocs.filter(d=>d.name.toLowerCase().includes(kw)||d.specialization.toLowerCase().includes(kw)));}
  function renderDocs(docs){
    const g=document.getElementById('docList');
    if(!docs.length){g.innerHTML='<div class="col-12 text-center text-muted">No doctors found</div>';return;}
    g.innerHTML=docs.map(d=>`<div class="col-md-6"><div class="p-3 rounded-3 border d-flex align-items-center gap-3 doc-sel" style="cursor:pointer;transition:.2s" onclick="selDoc2(${d.id},this)" data-id="${d.id}" data-name="${d.name}" data-spec="${d.specialization}" data-fee="${d.consultationFee||0}"><div class="doc-avatar" style="width:48px;height:48px;font-size:1rem"><i class="bi bi-person"></i></div><div><div class="fw-bold small">Dr. ${d.name}</div><div class="text-muted" style="font-size:.8rem">${d.specialization} &nbsp;|&nbsp; ₹${d.consultationFee||0}</div></div></div></div>`).join('');
  }
  function selDoc2(id,el){
    document.querySelectorAll('.doc-sel').forEach(x=>{x.style.borderColor='';x.style.background='';});
    el.style.borderColor='var(--pr)';el.style.background='var(--lt)';
    selDoc={id:parseInt(el.dataset.id),name:el.dataset.name,spec:el.dataset.spec,fee:parseFloat(el.dataset.fee)};
    document.getElementById('s1Btn').disabled=false;
  }
  function onDateChange(){
    const d=document.getElementById('aptDate').value;
    if(!d)return;
    document.getElementById('dateDisplay').innerHTML=`<span class="badge bg-primary px-3 py-2"><i class="bi bi-calendar-check me-2"></i>${new Date(d+'T00:00').toDateString()}</span>`;
    document.getElementById('s2Btn').disabled=false;
  }
  async function loadSlots(){
    if(!selDoc||!document.getElementById('aptDate').value)return;
    document.getElementById('slotGrid').innerHTML='<div class="text-muted">Loading...</div>';
    selTime=null;document.getElementById('s3Btn').disabled=true;
    try{
      const slots=await apiFetch('/api/doctors/'+selDoc.id+'/available-slots?date='+document.getElementById('aptDate').value);
      if(!slots.length){document.getElementById('slotGrid').innerHTML='<div class="text-danger col-12">No slots available on this date. Try another date.</div>';return;}
      document.getElementById('slotGrid').innerHTML=slots.map(s=>`<div class="col-4 col-md-2"><div class="time-slot" onclick="selSlot('${s}',this)">${s}</div></div>`).join('');
    }catch(e){document.getElementById('slotGrid').innerHTML='<div class="text-danger col-12">Error loading slots.</div>';}
  }
  function selSlot(t,el){document.querySelectorAll('.time-slot').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selTime=t;document.getElementById('s3Btn').disabled=false;}
  function goStep(n){
    document.getElementById('step'+cur).style.display='none';
    const old=document.getElementById('sd'+cur);old.classList.remove('active');old.classList.add('done');old.textContent='✓';
    if(cur<4)document.getElementById('sl'+cur).classList.add('done');
    document.getElementById('step'+n).style.display='block';
    document.getElementById('sd'+n).classList.add('active');
    cur=n;
    if(n===3)loadSlots();
    if(n===4)updateSummary();
  }
  function updateSummary(){
    document.getElementById('sumDoc').textContent='Dr. '+selDoc.name+' ('+selDoc.spec+')';
    document.getElementById('sumDate').textContent=new Date(document.getElementById('aptDate').value+'T00:00').toDateString();
    document.getElementById('sumTime').textContent=selTime;
    document.getElementById('sumFee').textContent='₹'+selDoc.fee;
  }
  // BUG FIX: endpoint was /api/patient/appointments → corrected to /api/appointments
  async function confirmBooking(){
    try{
      const r=await apiFetch('/api/appointments',{method:'POST',body:JSON.stringify({
        doctorId:selDoc.id,appointmentDate:document.getElementById('aptDate').value,
        appointmentTime:selTime,appointmentType:document.getElementById('aptType').value,
        symptoms:document.getElementById('symptoms').value
      })});
      showAlert('Appointment booked successfully! ID: #'+r.id);
      setTimeout(()=>window.location.href='/patient/my-appointments',2000);
    }catch(e){showAlert(e.message,'danger');}
  }
  load();
</script></body></html>
