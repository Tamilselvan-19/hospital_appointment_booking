<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Appointments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--pr:#0a4d8c;--ac:#00b4d8;--dk:#071d34;--lt:#f0f7ff}
    body{font-family:'DM Sans',sans-serif;background:#f3f6fb}
    .sidebar{min-height:100vh;background:var(--dk)}
    .sidebar .nav-link{color:rgba(255,255,255,.75);padding:12px 20px;transition:.2s}
    .sidebar .nav-link:hover,.sidebar .nav-link.active{color:#fff;background:rgba(255,255,255,.1);border-left:3px solid var(--ac)}
    .top-bar{background:#fff;padding:14px 28px;box-shadow:0 1px 12px rgba(10,77,140,.06);display:flex;align-items:center;justify-content:space-between}
    .main{padding:28px;flex:1;overflow-y:auto}
    .card-s{border:none;border-radius:16px;background:#fff;box-shadow:0 2px 16px rgba(10,77,140,.07);padding:22px}
    .stat-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
    .table thead{background:var(--pr);color:#fff}
    .table thead th{border:none;padding:13px 16px;font-weight:500}
    .table tbody td{padding:12px 16px;vertical-align:middle}
    .table tbody tr:hover{background:#f8fbff}
    .badge-pending{background:#fff3cd;color:#856404}
    .badge-confirmed{background:#d1ecf1;color:#0c5460}
    .badge-completed{background:#d4edda;color:#155724}
    .badge-cancelled{background:#f8d7da;color:#721c24}
    .badge-no_show{background:#e2e3e5;color:#383d41}
    .form-control,.form-select{border-radius:10px;border:1.5px solid #e2e8f0}
    .form-control:focus,.form-select:focus{border-color:var(--pr);box-shadow:0 0 0 3px rgba(10,77,140,.1)}
    .btn-primary{background:var(--pr);border:none;border-radius:10px}
    .btn-primary:hover{background:#0d5ea6}
    .alert-box{position:fixed;top:80px;right:24px;z-index:9999;min-width:300px}
    .time-slot{border:2px solid #e2e8f0;border-radius:10px;padding:10px;text-align:center;cursor:pointer;transition:.25s;font-weight:500}
    .time-slot:hover{border-color:var(--pr);background:var(--lt)}
    .time-slot.selected{border-color:var(--pr);background:var(--pr);color:#fff}
    .time-slot.unavailable{background:#fee2e2;border-color:#fca5a5;color:#991b1b;cursor:not-allowed}
    .doctor-card{border:none;border-radius:16px;box-shadow:0 2px 16px rgba(10,77,140,.07);transition:all .3s}
    .doctor-card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(10,77,140,.14)}
    .doc-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--pr),var(--ac));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.6rem}
    .step-wrap{display:flex;align-items:center;margin-bottom:32px}
    .step-dot{width:36px;height:36px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
    .step-dot.active{background:var(--pr);color:#fff}
    .step-dot.done{background:#16a34a;color:#fff}
    .step-line{flex:1;height:2px;background:#e2e8f0;margin:0 8px}
    .step-line.done{background:#16a34a}
  </style></head>
<body><div class="d-flex">
  <div class="col-md-2 sidebar p-0"><div class="p-4"><a href="/" class="text-white text-decoration-none"><h6 class="fw-bold mb-0"><i class="bi bi-heart-pulse me-2" style="color:#00b4d8"></i>MediBook</h6></a><small class="text-white-50">Patient</small></div><nav class="nav flex-column"><a class="nav-link" href="/dashboard"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a><a class="nav-link" href="/patient/find-doctors"><i class="bi bi-search me-2"></i>Find Doctors</a><a class="nav-link" href="/patient/book-appointment"><i class="bi bi-plus-circle me-2"></i>Book Appointment</a><a class="nav-link active" href="/patient/my-appointments"><i class="bi bi-calendar-check me-2"></i>My Appointments</a><a class="nav-link" href="/patient/profile"><i class="bi bi-person me-2"></i>Profile</a><a class="nav-link text-danger" href="/" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></nav></div>
  <div class="flex-grow-1">
    <div class="top-bar"><h6 class="fw-bold mb-0">My Appointments</h6><span id="uName" class="text-muted small"></span></div>
    <div class="main">
      <div class="alert-box"><div id="alertBox"></div></div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Appointment History</h5>
        <div class="d-flex gap-2">
          <select id="sf" class="form-select form-select-sm" style="width:150px" onchange="filter()">
            <option value="">All Status</option><option value="PENDING">Pending</option>
            <option value="CONFIRMED">Confirmed</option><option value="COMPLETED">Completed</option><option value="CANCELLED">Cancelled</option>
          </select>
          <a href="/patient/book-appointment" class="btn btn-primary btn-sm rounded-pill px-3"><i class="bi bi-plus-circle me-1"></i>New</a>
        </div>
      </div>
      <div id="aptContainer"><p class="text-muted">Loading...</p></div>
    </div>
  </div>
</div>
<!-- Details Modal -->
<div class="modal fade" id="detailModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content rounded-4">
  <div class="modal-header border-0"><h6 class="modal-title fw-bold">Appointment Details</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="detailBody"></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  
  const token=localStorage.getItem('token');
  const user=JSON.parse(localStorage.getItem('user')||'{}');
  function logout(){localStorage.removeItem('token');localStorage.removeItem('user');window.location.href='/';}
  function showAlert(msg,type='success'){
    const box=document.getElementById('alertBox');
    box.innerHTML=`<div class="alert alert-${type} alert-dismissible shadow-sm">${msg}<button class="btn-close" data-bs-dismiss="alert"></button></div>`;
    setTimeout(()=>{const a=box.querySelector('.alert');if(a)a.remove();},4000);
  }
  function badge(status){
    const m={PENDING:'badge-pending',CONFIRMED:'badge-confirmed',COMPLETED:'badge-completed',CANCELLED:'badge-cancelled',NO_SHOW:'badge-no_show'};
    return `<span class="badge rounded-pill px-3 py-2 ${m[status]||'bg-secondary'}">${status.replace('_',' ')}</span>`;
  }
  async function apiFetch(url,opts={}){
    const r=await fetch(url,{headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},...opts});
    const d=await r.json();
    if(!d.success) throw new Error(d.message||'Request failed');
    return d.data;
  }
  if(!token||user.role!=='PATIENT') window.location.href='/login';
  document.getElementById('uName').textContent=user.name;
  let all=[];
  // BUG FIX: loads all appointments (not just upcoming)
  async function load(){
    try{all=await apiFetch('/api/patient/appointments/all');filter();}
    catch(e){showAlert('Load failed','danger');}
  }
  function filter(){
    const st=document.getElementById('sf').value;
    render(st?all.filter(a=>a.status===st):all);
  }
  function render(apts){
    const c=document.getElementById('aptContainer');
    if(!apts.length){c.innerHTML=`<div class="text-center py-5"><i class="bi bi-calendar-x fs-1 text-muted d-block mb-2"></i><p class="text-muted">No appointments found.</p><a href="/patient/book-appointment" class="btn btn-primary rounded-pill">Book one now</a></div>`;return;}
    c.innerHTML=apts.map(a=>`
      <div class="card border-0 shadow-sm rounded-3 mb-3 overflow-hidden">
        <div class="row g-0 align-items-center">
          <div class="col-2 text-center p-3" style="background:var(--lt)">
            <div class="fw-bold fs-3 text-primary">${new Date(a.appointmentDate+'T00:00').getDate()}</div>
            <div class="text-muted small">${new Date(a.appointmentDate+'T00:00').toLocaleString('default',{month:'short'})}</div>
          </div>
          <div class="col-6 p-3">
            <div class="fw-bold">Dr. ${a.doctorName}</div>
            <div class="text-muted small">${a.doctorSpecialization}</div>
            <div class="text-muted small mt-1"><i class="bi bi-clock me-1"></i>${a.appointmentTime} &nbsp;|&nbsp; ${a.appointmentType}</div>
            ${a.symptoms?`<div class="text-muted small mt-1"><i class="bi bi-chat-left-text me-1"></i>${a.symptoms.substring(0,50)}${a.symptoms.length>50?'...':''}</div>`:''}
          </div>
          <div class="col-2 text-center">${badge(a.status)}</div>
          <div class="col-2 text-end p-3">
            <button class="btn btn-sm btn-outline-primary rounded-pill w-100 mb-1" onclick="viewDetail(${a.id})">View</button>
            ${(a.status==='PENDING'||a.status==='CONFIRMED')?`<button class="btn btn-sm btn-outline-danger rounded-pill w-100" onclick="cancelApt(${a.id})">Cancel</button>`:''}
          </div>
        </div>
      </div>`).join('');
  }
  // BUG FIX: uses GET /api/patient/appointments/<built-in function id> — the new endpoint added in controller
  async function viewDetail(id){
    try{
      const a=await apiFetch('/api/patient/appointments/'+id);
      document.getElementById('detailBody').innerHTML=`
        <div class="row g-3">
          <div class="col-md-6"><div class="p-3 rounded-3" style="background:var(--lt)"><div class="text-muted small mb-1">Doctor</div><div class="fw-bold">Dr. ${a.doctorName}</div><div class="text-muted small">${a.doctorSpecialization}</div></div></div>
          <div class="col-md-6"><div class="p-3 rounded-3" style="background:var(--lt)"><div class="text-muted small mb-1">Schedule</div><div class="fw-bold">${a.appointmentDate}</div><div class="text-muted small">${a.appointmentTime} — ${a.appointmentType}</div></div></div>
        </div>
        <div class="row g-3 mt-1">
          <div class="col-md-6"><div class="p-3 rounded-3" style="background:var(--lt)"><div class="text-muted small mb-1">Status</div>${badge(a.status)}</div></div>
          <div class="col-md-6"><div class="p-3 rounded-3" style="background:var(--lt)"><div class="text-muted small mb-1">Fee</div><div class="fw-bold text-primary">₹${a.consultationFee||0}</div><div class="text-muted small">${a.isPaid?'✓ Paid':'Not paid yet'}</div></div></div>
        </div>
        ${a.symptoms?`<div class="mt-3 p-3 rounded-3" style="background:var(--lt)"><div class="text-muted small mb-1">Symptoms</div>${a.symptoms}</div>`:''}
        ${a.diagnosis?`<div class="mt-3 p-3 rounded-3" style="background:#f0fdf4"><div class="text-muted small mb-1">Diagnosis</div><div class="fw-500">${a.diagnosis}</div></div>`:''}
        ${a.prescription?`<div class="mt-3 p-3 rounded-3" style="background:#f0fdf4"><div class="text-muted small mb-1">Prescription</div>${a.prescription}</div>`:''}
      `;
      new bootstrap.Modal(document.getElementById('detailModal')).show();
    }catch(e){showAlert(e.message,'danger');}
  }
  // BUG FIX: changed from POST to PUT to match backend @PutMapping
  async function cancelApt(id){
    if(!confirm('Cancel this appointment?'))return;
    try{await apiFetch('/api/appointments/'+id+'/cancel?reason=Cancelled+by+patient',{method:'PUT'});showAlert('Appointment cancelled');load();}
    catch(e){showAlert(e.message,'danger');}
  }
  load();
</script></body></html>
